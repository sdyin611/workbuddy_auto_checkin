name: Qoder 每日签到（中国版 PAT · 手动备用）

# 国际版的每日签到已迁到 qoder-daily.yml（QODER_GLOBAL_TOKENS）。
# 本工作流保留给 Qoder 中国版 + PAT 方案，只保留手动触发，避免两套定时重复跑。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoder-daily
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位 Python 解释器
        id: py
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print("使用解释器:", sys.executable, sys.version.split()[0])'
          echo "python_path=$PY" >> "$GITHUB_OUTPUT"

      - name: 执行签到
        id: run
        env:
          QODER_PAT: ${{ secrets.QODER_PAT }}
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          QODER_RESULT_FILE: ${{ runner.temp }}/qoder_result.md
        run: |
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          set +e
          "$PY" qoder_checkin.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 成功（CLAIMED/ALREADY）退出码为 0；失败时仅 warning 不挂红，
          # 失败详情已在日志与微信推送里。
          if [ "$code" -ne 0 ]; then
            echo "::warning::本轮签到未达成，详见上方日志与微信推送"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/qoder_result.md
        run: |
          set -uo pipefail
          {
            echo "### Qoder 每日签到"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi
